name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm test

      - name: build
        run: npm run build
